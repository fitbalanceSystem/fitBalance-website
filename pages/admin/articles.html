<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/icons/icon.png">
  <title>מאמרים | FitBalance</title>
  <link rel="stylesheet" href="css/admin-theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../services/supabaseClient.js"></script>
  <style>
    .article-img { width:52px; height:52px; object-fit:cover; border-radius:10px; border:1px solid #f3f0ff; }
    .article-img-placeholder { width:52px; height:52px; border-radius:10px; background:#f3f0ff; display:flex; align-items:center; justify-content:center; font-size:22px; }
    .badge-published { background:#d1fae5; color:#065f46; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; }
    .badge-draft     { background:#fef3c7; color:#92400e; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; }
    #articleModal { display:none; position:fixed; inset:0; background:rgba(15,10,40,.65); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    #articleModal.open { display:flex; }
    .form-field { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
    .form-field label { font-size:12px; font-weight:600; color:#6b7280; }
    .form-field input, .form-field textarea, .form-field select {
      border:1.5px solid #e5e7eb; border-radius:10px; padding:9px 12px;
      font-size:13px; font-family:inherit; outline:none; transition:border-color .2s;
    }
    .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
      border-color:#8b5cf6; box-shadow:0 0 0 3px rgba(139,92,246,.1);
    }
    .form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    #img-preview { width:100%; height:140px; object-fit:cover; border-radius:12px; display:none; }
    #img-placeholder {
      height:140px; border-radius:12px; border:2px dashed #ede9fe;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:6px; cursor:pointer; color:#9ca3af; font-size:13px; transition:border-color .2s;
    }
    #img-placeholder:hover { border-color:#8b5cf6; color:#7c3aed; }
    .modal-tabs { display:flex; gap:6px; margin-bottom:16px; }
    .modal-tab {
      border-radius:8px; border:1.5px solid #ede9fe; background:white;
      color:#6b7280; font-size:12px; font-weight:600; padding:6px 14px;
      font-family:inherit; cursor:pointer; transition:all .2s;
    }
    .modal-tab.active { background:linear-gradient(135deg,#ec4899,#8b5cf6); color:white; border-color:transparent; }
    .modal-tab:hover:not(.active) { background:#f3f0ff; color:#7c3aed; }
    .tab-pane { display:none; }
    .tab-pane.active { display:block; }
  </style>
</head>
<body>
<div class="container">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <header class="page-header">
      <h1>📝 מאמרים</h1>
      <button id="addBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium text-sm">+ מאמר חדש</button>
    </header>

    <!-- חיפוש + סינון -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="חיפוש לפי כותרת או מחבר..." />
      <select id="statusFilter">
        <option value="">כל הסטטוסים</option>
        <option value="published">מפורסם</option>
        <option value="draft">טיוטה</option>
      </select>
      <select id="catFilter"><option value="">כל הקטגוריות</option></select>
      <i class="fas fa-search"></i>
    </div>

    <div style="margin-bottom:10px; display:flex; align-items:center; gap:8px;">
      <span style="color:#555; font-size:14px;">מוצגים:</span>
      <span id="countBadge">0</span>
      <span style="color:#555; font-size:14px;">מאמרים</span>
    </div>

    <div class="table-section">
      <table class="customers-table">
        <thead>
          <tr>
            <th>תמונה</th>
            <th>כותרת</th>
            <th>קטגוריה</th>
            <th>מחבר</th>
            <th>תאריך פרסום</th>
            <th>סטטוס</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="articlesBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- מודאל הוספה/עריכה -->
<div id="articleModal">
  <div style="background:white; border-radius:20px; width:620px; max-width:95vw; max-height:90vh; overflow-y:auto; box-shadow:0 25px 60px rgba(0,0,0,.2); position:relative;">
    <div style="background:linear-gradient(135deg,#ec4899,#8b5cf6); padding:20px 24px; border-radius:20px 20px 0 0; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10;">
      <h2 id="modalTitle" style="color:white; font-size:18px; font-weight:800; margin:0;">מאמר חדש</h2>
      <button onclick="closeModal()" style="background:rgba(255,255,255,.2); border:none; color:white; width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">✕</button>
    </div>

    <div style="padding:24px;">

      <!-- תמונה ראשית -->
      <div class="form-field" style="margin-bottom:16px;">
        <label>תמונה ראשית</label>
        <div id="img-placeholder" onclick="document.getElementById('imgInput').click()">
          <i class="fas fa-cloud-upload-alt" style="font-size:24px;"></i>
          <span>לחצי להעלאת תמונה</span>
        </div>
        <img id="img-preview" />
        <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="previewImage(this)" />
        <button id="removeImgBtn" onclick="removeImage()" style="display:none; margin-top:6px; font-size:12px; color:#ef4444; background:none; border:none; cursor:pointer;">✕ הסר תמונה</button>
      </div>

      <!-- טאבים -->
      <div class="modal-tabs">
        <button class="modal-tab active" onclick="switchTab('content', this)">📄 תוכן</button>
        <button class="modal-tab" onclick="switchTab('meta', this)">🔍 SEO</button>
      </div>

      <!-- טאב תוכן -->
      <div id="tab-content" class="tab-pane active">
        <div class="form-field">
          <label>כותרת *</label>
          <input type="text" id="f-title" placeholder="כותרת המאמר" oninput="autoSlug()" />
        </div>
        <div class="form-field">
          <label>Slug <span style="font-size:11px;color:#9ca3af;font-weight:400">(כתובת URL — אנגלית, מקפים)</span></label>
          <input type="text" id="f-slug" placeholder="article-url-slug" dir="ltr" />
        </div>
        <div class="form-grid-2">
          <div class="form-field">
            <label>מחבר</label>
            <input type="text" id="f-author" placeholder="שם המחבר" />
          </div>
          <div class="form-field">
            <label>קטגוריה</label>
            <input type="text" id="f-category" placeholder="לדוגמה: תזונה, כושר" list="cats-list" />
            <datalist id="cats-list"></datalist>
          </div>
        </div>
        <div class="form-field">
          <label>תקציר</label>
          <textarea id="f-summary" rows="2" placeholder="תיאור קצר של המאמר..."></textarea>
        </div>
        <div class="form-field">
          <label>תוכן מלא</label>
          <textarea id="f-content" rows="8" placeholder="תוכן המאמר..."></textarea>
        </div>
        <div class="form-grid-2">
          <div class="form-field">
            <label>סטטוס</label>
            <select id="f-status">
              <option value="draft">טיוטה</option>
              <option value="published">מפורסם</option>
            </select>
          </div>
          <div class="form-field">
            <label>תאריך פרסום</label>
            <input type="datetime-local" id="f-published-at" />
          </div>
        </div>
        <div class="form-field">
          <label>הצג במערכות</label>
          <div style="display:flex;gap:20px;padding:10px 0;">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#374151;cursor:pointer;">
              <input type="checkbox" id="f-show-public" style="width:15px;height:15px;accent-color:#8b5cf6;" /> אתר ראשי
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#374151;cursor:pointer;">
              <input type="checkbox" id="f-show-customers" style="width:15px;height:15px;accent-color:#8b5cf6;" /> מערכת לקוחות
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#374151;cursor:pointer;">
              <input type="checkbox" id="f-show-employees" style="width:15px;height:15px;accent-color:#8b5cf6;" /> מערכת עובדים
            </label>
          </div>
        </div>
      </div>

      <!-- טאב SEO -->
      <div id="tab-meta" class="tab-pane">
        <div class="form-field">
          <label>Meta Title <span style="font-size:11px;color:#9ca3af;font-weight:400">(ברירת מחדל: כותרת המאמר)</span></label>
          <input type="text" id="f-meta-title" placeholder="כותרת לגוגל..." />
        </div>
        <div class="form-field">
          <label>Meta Description <span style="font-size:11px;color:#9ca3af;font-weight:400">(עד 160 תווים)</span></label>
          <textarea id="f-meta-desc" rows="3" placeholder="תיאור לגוגל..." oninput="updateMetaCount(this)"></textarea>
          <span id="meta-count" style="font-size:11px;color:#9ca3af;text-align:left;">0 / 160</span>
        </div>
        <div style="background:#f9fafb;border-radius:12px;padding:14px;margin-top:8px;">
          <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px;">תצוגה מקדימה בגוגל</div>
          <div style="font-size:14px;color:#1a0dab;font-weight:500;" id="seo-preview-title">כותרת המאמר</div>
          <div style="font-size:12px;color:#006621;margin:2px 0;" id="seo-preview-url">fitbalance.co.il/blog/slug</div>
          <div style="font-size:12px;color:#545454;" id="seo-preview-desc">תיאור המאמר יופיע כאן...</div>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:20px; justify-content:flex-end;">
        <button onclick="closeModal()" style="padding:10px 20px;border:1.5px solid #e5e7eb;border-radius:10px;background:white;font-size:13px;cursor:pointer;font-family:inherit;">ביטול</button>
        <button id="saveBtn" onclick="saveArticle()" style="padding:10px 24px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">שמור</button>
      </div>
    </div>
  </div>
</div>

<script src="utilities/sidebar.js"></script>
<script>
  let articles = [], editId = null, currentImageUrl = null;

  // ── טאבים ──────────────────────────────────────────────────
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.modal-tab').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // ── טעינה ──────────────────────────────────────────────────
  async function load() {
    const { data, error } = await window._sb
      .from('articles')
      .select('id,title,slug,summary,image_url,author,category,status,published_at,meta_title,meta_desc,content,created_at,show_public,show_customers,show_employees')
      .order('created_at', { ascending: false });
    if (error) { console.error('articles load error:', error); return; }
    articles = data ?? [];
    populateCatFilter();
    render();
  }

  function populateCatFilter() {
    const cats = [...new Set(articles.map(a => a.category).filter(Boolean))].sort();
    const sel = document.getElementById('catFilter');
    sel.innerHTML = '<option value="">כל הקטגוריות</option>';
    cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
    // datalist לשדה קטגוריה במודאל
    const dl = document.getElementById('cats-list');
    dl.innerHTML = cats.map(c => `<option value="${c}">`).join('');
  }

  // ── רינדור טבלה ────────────────────────────────────────────
  function render() {
    const q   = document.getElementById('searchInput').value.trim().toLowerCase();
    const st  = document.getElementById('statusFilter').value;
    const cat = document.getElementById('catFilter').value;

    const filtered = articles.filter(a => {
      if (q && !a.title?.toLowerCase().includes(q) && !a.author?.toLowerCase().includes(q)) return false;
      if (st  && a.status   !== st)  return false;
      if (cat && a.category !== cat) return false;
      return true;
    });

    document.getElementById('countBadge').textContent = filtered.length;
    const tbody = document.getElementById('articlesBody');
    tbody.innerHTML = filtered.length ? filtered.map(a => `
      <tr>
        <td>${a.image_url
          ? `<img class="article-img" src="${a.image_url}" alt="${a.title}" />`
          : `<div class="article-img-placeholder">📝</div>`}
        </td>
        <td>
          <strong>${a.title}</strong>
          ${a.summary ? `<div style="font-size:11px;color:#9ca3af;margin-top:2px;">${a.summary.slice(0,60)}${a.summary.length>60?'…':''}</div>` : ''}
        </td>
        <td>${a.category || '—'}</td>
        <td>${a.author || '—'}</td>
        <td>${a.published_at ? new Date(a.published_at).toLocaleDateString('he-IL') : '—'}</td>
        <td><span class="${a.status === 'published' ? 'badge-published' : 'badge-draft'}">${a.status === 'published' ? 'מפורסם' : 'טיוטה'}</span></td>
        <td style="display:flex;gap:6px;">
          <button onclick="openEdit(${a.id})" style="background:#f3f0ff;color:#7c3aed;border:1px solid #ede9fe;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;">✏️ עריכה</button>
          <button onclick="deleteArticle(${a.id})" style="background:#fee2e2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;">🗑️</button>
        </td>
      </tr>`).join('')
      : '<tr><td colspan="7" style="text-align:center;color:#9ca3af;padding:40px;">אין מאמרים</td></tr>';
  }

  // ── פתיחת מודאל ────────────────────────────────────────────
  function openAdd() {
    editId = null; currentImageUrl = null;
    document.getElementById('modalTitle').textContent = 'מאמר חדש';
    ['f-title','f-slug','f-author','f-category','f-summary','f-content','f-meta-title','f-meta-desc','f-published-at'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    document.getElementById('f-status').value = 'draft';
    document.getElementById('f-show-public').checked    = true;
    document.getElementById('f-show-customers').checked = false;
    document.getElementById('f-show-employees').checked = false;
    resetImageUI();
    updateSeoPreview();
    switchTab('content', document.querySelector('.modal-tab'));
    document.getElementById('articleModal').classList.add('open');
  }

  function openEdit(id) {
    const a = articles.find(x => x.id === id);
    if (!a) return;
    editId = id; currentImageUrl = a.image_url ?? null;
    document.getElementById('modalTitle').textContent = 'עריכת מאמר';
    document.getElementById('f-title').value       = a.title        ?? '';
    document.getElementById('f-slug').value        = a.slug         ?? '';
    document.getElementById('f-author').value      = a.author       ?? '';
    document.getElementById('f-category').value    = a.category     ?? '';
    document.getElementById('f-summary').value     = a.summary      ?? '';
    document.getElementById('f-content').value     = a.content      ?? '';
    document.getElementById('f-status').value      = a.status       ?? 'draft';
    document.getElementById('f-meta-title').value  = a.meta_title   ?? '';
    document.getElementById('f-meta-desc').value   = a.meta_desc    ?? '';
    document.getElementById('f-published-at').value = a.published_at
      ? a.published_at.slice(0,16) : '';
    document.getElementById('f-show-public').checked    = a.show_public    ?? true;
    document.getElementById('f-show-customers').checked = a.show_customers ?? false;
    document.getElementById('f-show-employees').checked = a.show_employees ?? false;
    if (a.image_url) {
      document.getElementById('img-preview').src = a.image_url;
      document.getElementById('img-preview').style.display = 'block';
      document.getElementById('img-placeholder').style.display = 'none';
      document.getElementById('removeImgBtn').style.display = 'inline-block';
    } else { resetImageUI(); }
    updateMetaCount(document.getElementById('f-meta-desc'));
    updateSeoPreview();
    switchTab('content', document.querySelector('.modal-tab'));
    document.getElementById('articleModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('articleModal').classList.remove('open');
    document.getElementById('imgInput').value = '';
  }

  // ── תמונה ──────────────────────────────────────────────────
  function previewImage(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('img-preview').src = e.target.result;
      document.getElementById('img-preview').style.display = 'block';
      document.getElementById('img-placeholder').style.display = 'none';
      document.getElementById('removeImgBtn').style.display = 'inline-block';
    };
    reader.readAsDataURL(file);
  }

  function removeImage() {
    currentImageUrl = null;
    document.getElementById('imgInput').value = '';
    resetImageUI();
  }

  function resetImageUI() {
    document.getElementById('img-preview').style.display = 'none';
    document.getElementById('img-preview').src = '';
    document.getElementById('img-placeholder').style.display = 'flex';
    document.getElementById('removeImgBtn').style.display = 'none';
  }

  async function uploadImage(file) {
    const ext  = file.name.split('.').pop();
    const path = `articles/${Date.now()}.${ext}`;
    const { error } = await window._sb.storage.from('products').upload(path, file, { upsert: true });
    if (error) throw error;
    return window._sb.storage.from('products').getPublicUrl(path).data.publicUrl;
  }

  // ── slug אוטומטי ────────────────────────────────────────────
  function autoSlug() {
    if (editId) return; // בעריכה — לא דורסים slug קיים
    const title = document.getElementById('f-title').value;
    const slug = title
      .toLowerCase()
      .replace(/[\u0590-\u05FF]/g, '') // הסרת עברית
      .replace(/[^a-z0-9\s-]/g, '')
      .trim()
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .slice(0, 80);
    document.getElementById('f-slug').value = slug;
    updateSeoPreview();
  }

  // ── SEO preview ─────────────────────────────────────────────
  function updateMetaCount(el) {
    document.getElementById('meta-count').textContent = `${el.value.length} / 160`;
    updateSeoPreview();
  }

  function updateSeoPreview() {
    const title = document.getElementById('f-meta-title').value || document.getElementById('f-title').value || 'כותרת המאמר';
    const slug  = document.getElementById('f-slug').value || 'slug';
    const desc  = document.getElementById('f-meta-desc').value || document.getElementById('f-summary').value || 'תיאור המאמר יופיע כאן...';
    document.getElementById('seo-preview-title').textContent = title;
    document.getElementById('seo-preview-url').textContent   = `fitbalance.co.il/blog/${slug}`;
    document.getElementById('seo-preview-desc').textContent  = desc.slice(0, 160);
  }

  // ── שמירה ──────────────────────────────────────────────────
  async function saveArticle() {
    const title = document.getElementById('f-title').value.trim();
    const slug  = document.getElementById('f-slug').value.trim();
    if (!title) { alert('נא להזין כותרת'); return; }
    if (!slug)  { alert('נא להזין slug'); return; }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'שומר...';

    try {
      const file = document.getElementById('imgInput').files[0];
      let imageUrl = currentImageUrl;
      if (file) imageUrl = await uploadImage(file);

      const pubAt = document.getElementById('f-published-at').value;
      const status = document.getElementById('f-status').value;

      const payload = {
        title,
        slug,
        summary:      document.getElementById('f-summary').value.trim()    || null,
        content:      document.getElementById('f-content').value.trim()     || null,
        image_url:    imageUrl,
        author:       document.getElementById('f-author').value.trim()      || null,
        category:     document.getElementById('f-category').value.trim()    || null,
        status,
        published_at: pubAt || (status === 'published' ? new Date().toISOString() : null),
        show_public:    document.getElementById('f-show-public').checked,
        show_customers: document.getElementById('f-show-customers').checked,
        show_employees: document.getElementById('f-show-employees').checked,
        meta_title:   document.getElementById('f-meta-title').value.trim()  || null,
        meta_desc:    document.getElementById('f-meta-desc').value.trim()   || null,
      };

      if (editId) {
        const { error } = await window._sb.from('articles').update(payload).eq('id', editId);
        if (error) throw error;
      } else {
        const { error } = await window._sb.from('articles').insert(payload);
        if (error) throw error;
      }

      closeModal();
      await load();
    } catch (err) {
      console.error(err);
      alert('שגיאה בשמירה: ' + (err.message ?? err));
    } finally {
      btn.disabled = false; btn.textContent = 'שמור';
    }
  }

  // ── מחיקה ──────────────────────────────────────────────────
  async function deleteArticle(id) {
    const a = articles.find(x => x.id === id);
    if (!confirm(`למחוק את המאמר "${a?.title}"?`)) return;
    const { error } = await window._sb.from('articles').delete().eq('id', id);
    if (error) { alert('שגיאה במחיקה: ' + error.message); return; }
    await load();
  }

  // ── אירועים ────────────────────────────────────────────────
  document.getElementById('addBtn').addEventListener('click', openAdd);
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('statusFilter').addEventListener('change', render);
  document.getElementById('catFilter').addEventListener('change', render);

  // SEO preview live update
  ['f-title','f-slug','f-meta-title','f-summary'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', updateSeoPreview);
  });

  load();
</script>

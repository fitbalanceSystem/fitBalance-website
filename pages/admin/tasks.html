<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../assets/icons/icon.png">
  <title>לוח משימות</title>
  <link rel="stylesheet" href="css/admin-theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../services/supabaseClient.js"></script>
  <script src="js/tasks.js" type="module" defer></script>
  <style>
    .kanban-board { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 16px; align-items: flex-start; }
    .kanban-col {
      min-width: 290px; flex: 1;
      background: #f8f7ff; border-radius: 16px;
      border: 1px solid #ede9fe; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .kanban-col.drag-over { background: #ede9fe; border-color: #8b5cf6; }
    .kanban-col-title {
      font-size: 14px; font-weight: 700; color: #4b5563;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    .col-count { background: #ede9fe; color: #7c3aed; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
    .tasks-list { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }

    .task-card {
      background: white; border-radius: 12px;
      border: 1px solid #f3f0ff;
      box-shadow: 0 2px 8px rgba(139,92,246,.07);
      padding: 14px; cursor: grab;
      transition: box-shadow .2s, transform .2s, opacity .2s;
      user-select: none;
    }
    .task-card:hover { box-shadow: 0 4px 16px rgba(139,92,246,.15); transform: translateY(-1px); }
    .task-card.dragging { opacity: .4; cursor: grabbing; }
    .task-card.overdue  { border-color: #fecaca !important; background: #fff5f5 !important; }
    .task-card.near     { border-color: #fde68a !important; background: #fffbeb !important; }

    .task-title { font-size: 14px; font-weight: 600; color: #1f2937; margin-bottom: 6px; }
    .task-meta  { font-size: 12px; color: #9ca3af; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .priority-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .priority-high   { background: #fee2e2; color: #dc2626; }
    .priority-medium { background: #fef3c7; color: #d97706; }
    .priority-low    { background: #d1fae5; color: #059669; }
    .badge-alert  { font-size: 11px; background: #fee2e2; color: #dc2626; border-radius: 999px; padding: 2px 8px; font-weight: 700; }
    .badge-near   { font-size: 11px; background: #fef3c7; color: #d97706; border-radius: 999px; padding: 2px 8px; font-weight: 700; }

    /* מודאל */
    #taskModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
    #taskModal.open { display:flex; }
    #taskModalBox { background:white; border-radius:16px; width:480px; max-width:95vw; max-height:92vh; overflow-y:auto; padding:28px; direction:rtl; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .modal-title { font-size:18px; font-weight:700; color:#1f2937; margin-bottom:20px; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:9px 12px; border:1px solid #d1d5db;
      border-radius:8px; font-size:14px; font-family:inherit; outline:none; transition:border-color .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#8b5cf6; }
    .form-group textarea { resize:vertical; min-height:72px; }
    .row2 { display:flex; gap:12px; }
    .row2 .form-group { flex:1; }
    .reminder-row { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#f8f7ff; border-radius:10px; border:1px solid #ede9fe; margin-bottom:14px; }
    .reminder-row label { font-size:13px; font-weight:600; color:#374151; cursor:pointer; }
    .reminder-row input[type=checkbox] { width:16px; height:16px; accent-color:#8b5cf6; cursor:pointer; flex-shrink:0; }
    .modal-actions { display:flex; gap:10px; margin-top:20px; }
    .btn-primary  { flex:1; background:linear-gradient(135deg,#ec4899,#8b5cf6); color:white; border:none; padding:10px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-secondary{ flex:1; background:#f3f4f6; color:#374151; border:none; padding:10px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
    .add-task-btn { width:100%; padding:8px; border:2px dashed #c4b5fd; border-radius:10px; background:transparent; color:#8b5cf6; font-size:13px; font-weight:600; cursor:pointer; transition:background .2s; }
    .add-task-btn:hover { background:#ede9fe; }
  </style>
</head>
<body>
  <div class="container">
    <div id="sidebar-placeholder"></div>
    <script src="utilities/sidebar.js"></script>

    <main class="main-content">
      <header class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <h1>לוח משימות</h1>
        <button id="newTaskBtn" style="background:linear-gradient(135deg,#ec4899,#8b5cf6);color:white;border:none;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">
          + משימה חדשה
        </button>
      </header>

      <div id="table-loader" style="display:none;justify-content:center;padding:40px;">
        <i class="fas fa-spinner fa-spin" style="font-size:28px;color:#8b5cf6;"></i>
      </div>

      <div class="kanban-board" id="kanbanBoard">
        <div class="kanban-col" data-status="todo">
          <div class="kanban-col-title">
            <span>📋 לביצוע</span>
            <span class="col-count" id="count-todo">0</span>
          </div>
          <div class="tasks-list" id="list-todo"></div>
          <button class="add-task-btn" data-status="todo">+ הוסף משימה</button>
        </div>
        <div class="kanban-col" data-status="in_progress">
          <div class="kanban-col-title">
            <span>⚡ בביצוע</span>
            <span class="col-count" id="count-in_progress">0</span>
          </div>
          <div class="tasks-list" id="list-in_progress"></div>
          <button class="add-task-btn" data-status="in_progress">+ הוסף משימה</button>
        </div>
        <div class="kanban-col" data-status="done">
          <div class="kanban-col-title">
            <span>✅ הושלם</span>
            <span class="col-count" id="count-done">0</span>
          </div>
          <div class="tasks-list" id="list-done"></div>
          <button class="add-task-btn" data-status="done">+ הוסף משימה</button>
        </div>
      </div>
    </main>
  </div>

  <!-- מודאל הוספה/עריכה -->
  <div id="taskModal">
    <div id="taskModalBox">
      <div class="modal-title" id="modalTitle">משימה חדשה</div>
      <form id="taskForm" onsubmit="return false">
        <div class="form-group">
          <label>כותרת *</label>
          <input type="text" id="taskTitle" required placeholder="מה צריך לעשות?" />
        </div>
        <div class="form-group">
          <label>תיאור</label>
          <textarea id="taskDesc" placeholder="פרטים נוספים..."></textarea>
        </div>
        <div class="row2">
          <div class="form-group">
            <label>עדיפות</label>
            <select id="taskPriority">
              <option value="low">נמוכה</option>
              <option value="medium" selected>בינונית</option>
              <option value="high">גבוהה</option>
            </select>
          </div>
          <div class="form-group">
            <label>סטטוס</label>
            <select id="taskStatus">
              <option value="todo">לביצוע</option>
              <option value="in_progress">בביצוע</option>
              <option value="done">הושלם</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="form-group">
            <label>תאריך יעד</label>
            <input type="date" id="taskDueDate" />
          </div>
          <div class="form-group">
            <label>שעת ביצוע</label>
            <input type="time" id="taskDueTime" />
          </div>
        </div>
        <div class="reminder-row">
          <input type="checkbox" id="taskReminder" />
          <label for="taskReminder">🔔 תזכר אותי לפני המועד</label>
          <select id="taskReminderMin" style="width:auto;padding:5px 8px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;">
            <option value="15">15 דקות לפני</option>
            <option value="30" selected>30 דקות לפני</option>
            <option value="60">שעה לפני</option>
            <option value="120">שעתיים לפני</option>
            <option value="1440">יום לפני</option>
          </select>
        </div>
      </form>
      <div class="modal-actions">
        <button class="btn-primary" id="saveTaskBtn">שמור</button>
        <button class="btn-secondary" id="closeModalBtn">ביטול</button>
      </div>
    </div>
  </div>
</body>
</html>

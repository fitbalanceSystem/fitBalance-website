<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitBalance | המסמכים שלי</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

<div class="page-content" style="padding:28px;padding-top:88px;max-width:860px;margin-right:auto;margin-left:auto">

  <div class="card fade-in" style="padding:24px;border-radius:20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <span style="width:34px;height:34px;border-radius:10px;background:#f3f0ff;display:inline-flex;align-items:center;justify-content:center">
        <i class="fas fa-file-contract" style="color:#8b5cf6;font-size:14px"></i>
      </span>
      <span style="font-size:15px;font-weight:700;color:#374151">המסמכים שלי</span>
    </div>

    <div id="docs-list" style="display:flex;flex-direction:column;gap:10px">
      <div class="skeleton" style="height:64px;border-radius:12px"></div>
      <div class="skeleton" style="height:64px;border-radius:12px"></div>
    </div>
  </div>

</div>

<!-- PDF viewer modal -->
<div id="pdf-modal" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;width:90%;max-width:800px;height:85vh;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #f3f0ff">
      <span id="modal-title" style="font-size:14px;font-weight:700;color:#1f2937"></span>
      <button id="modal-close" style="background:none;border:none;font-size:20px;color:#9ca3af;cursor:pointer">&times;</button>
    </div>
    <iframe id="pdf-frame" style="flex:1;border:none;width:100%"></iframe>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../services/supabaseClient.js"></script>
<script src="../../utils/constants.js"></script>
<script src="../../utils/storage.js"></script>
<script src="../../utils/cart.js"></script>
<script src="../../utils/formatter.js"></script>
<script src="../../utils/helpers.js"></script>
<script src="../../utils/popup.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/customerService.js"></script>
<script src="../../services/formsService.js"></script>
<script src="../../services/pdfService.js"></script>
<script src="../../middleware/auth.js"></script>
<script src="../../layouts/layout.js"></script>
<script src="../../assets/js/pages/customer/documents.js"></script>
</body>
</html>

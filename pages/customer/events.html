<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitBalance | אירועים בקהילה</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .filters-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:28px; }
    .search-wrap { flex:1; min-width:200px; position:relative; }
    .search-wrap i { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#9ca3af; font-size:14px; pointer-events:none; }
    .search-wrap input {
      width:100%; padding:10px 40px 10px 14px;
      border:1.5px solid #e5e7eb; border-radius:12px;
      font-size:14px; font-family:inherit; outline:none;
      background:white; transition:border-color .2s;
    }
    .search-wrap input:focus { border-color:#8b5cf6; box-shadow:0 0 0 3px rgba(139,92,246,.08); }
    .cat-btn {
      border:1.5px solid #e5e7eb; border-radius:999px;
      background:white; color:#6b7280;
      font-size:13px; font-weight:600; padding:7px 16px;
      font-family:inherit; cursor:pointer; transition:all .2s; white-space:nowrap;
    }
    .cat-btn:hover { border-color:#8b5cf6; color:#7c3aed; }
    .cat-btn.active {
      background:linear-gradient(135deg,#ec4899,#8b5cf6);
      color:white; border-color:transparent;
      box-shadow:0 4px 14px rgba(236,72,153,.3);
    }
    .events-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
      gap:24px;
    }
    .event-card {
      background:white; border-radius:16px;
      border:1px solid #f0eeff;
      box-shadow:0 2px 16px rgba(139,92,246,.05);
      overflow:hidden; display:flex; flex-direction:column;
      transition:transform .25s ease, box-shadow .25s ease;
      animation:fadeUp .45s ease both;
    }
    .event-card:hover { transform:translateY(-4px); box-shadow:0 16px 40px rgba(139,92,246,.12); }
    .card-img {
      height:180px;
      background:linear-gradient(135deg,#f5f3ff,#fce7f3);
      display:flex; align-items:center; justify-content:center;
      font-size:48px; overflow:hidden; flex-shrink:0; position:relative;
    }
    .card-img img { width:100%; height:100%; object-fit:cover; display:block; }
    .card-cat-overlay {
      position:absolute; bottom:10px; right:10px;
      background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
      color:#7c3aed; font-size:11px; font-weight:700;
      padding:3px 10px; border-radius:999px;
      border:1px solid rgba(139,92,246,.2);
    }
    .card-body { padding:18px; flex:1; display:flex; flex-direction:column; gap:8px; }
    .card-title { font-size:16px; font-weight:800; color:#111827; line-height:1.4; }
    .card-summary { font-size:13px; color:#6b7280; line-height:1.7; flex:1; }
    .card-meta { display:flex; flex-direction:column; gap:5px; padding-top:10px; border-top:1px solid #f3f0ff; }
    .card-meta-row { display:flex; align-items:center; gap:7px; font-size:12px; color:#6b7280; }
    .card-meta-row i { color:#a78bfa; width:14px; text-align:center; }
    .state-msg { text-align:center; padding:60px 20px; color:#9ca3af; }
    .spinner {
      width:32px; height:32px; border:3px solid #ede9fe;
      border-top-color:#8b5cf6; border-radius:50%;
      animation:spin .7s linear infinite; margin:0 auto 14px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<div class="page-content p-5">

  <div class="card p-5 mb-5 fade-in">
    <h1 class="text-lg font-bold text-gray-800 flex items-center gap-2">
      <i class="fas fa-calendar-star text-pink-500"></i> אירועים בקהילה
    </h1>
  </div>

  <div class="filters-bar fade-in" id="filters-bar">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="חיפוש אירועים..." oninput="render()" />
    </div>
    <button class="cat-btn active" data-cat="" onclick="selectCat('', this)">הכל</button>
  </div>

  <div id="loading-screen" class="state-msg">
    <div class="spinner"></div>
    <p style="font-size:14px">טוען אירועים...</p>
  </div>

  <div id="empty-screen" class="state-msg" style="display:none">
    <div style="font-size:40px;margin-bottom:10px;opacity:.4">📭</div>
    <p style="font-size:15px">לא נמצאו אירועים</p>
  </div>

  <div class="events-grid" id="events-grid" style="display:none"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../services/supabaseClient.js"></script>
<script src="../../utils/constants.js"></script>
<script src="../../utils/storage.js"></script>
<script src="../../utils/cart.js"></script>
<script src="../../utils/formatter.js"></script>
<script src="../../utils/helpers.js"></script>
<script src="../../utils/popup.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/customerService.js"></script>
<script src="../../middleware/auth.js"></script>
<script>
  window.authMiddleware.requireAuth = async () => window.storageUtil?.load() || null;
</script>
<script src="../../layouts/layout.js"></script>
<script>
  renderLayout('events');

  const sb = window._sb;
  let events = [], activeCat = '';

  async function init() {
    const { data, error } = await sb.from('community_events')
      .select('id,title,description,thumbnail_url,category,location,event_date,event_end,max_spots,sort_order')
      .eq('is_published', true)
      .order('sort_order', { ascending: true })
      .order('event_date', { ascending: true });

    document.getElementById('loading-screen').style.display = 'none';

    if (error || !data?.length) {
      document.getElementById('empty-screen').style.display = 'block';
      return;
    }

    events = data;
    buildCatButtons();
    render();
  }

  function buildCatButtons() {
    const cats = [...new Set(events.map(e => e.category).filter(Boolean))].sort();
    const bar = document.getElementById('filters-bar');
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.dataset.cat = cat;
      btn.textContent = cat;
      btn.onclick = () => selectCat(cat, btn);
      bar.appendChild(btn);
    });
  }

  function selectCat(cat, btn) {
    activeCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function formatDate(dt) {
    if (!dt) return '';
    return new Date(dt).toLocaleDateString('he-IL', { day:'numeric', month:'long', year:'numeric' });
  }

  function formatTime(dt) {
    if (!dt) return '';
    return new Date(dt).toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' });
  }

  function isPast(dt) {
    return dt && new Date(dt) < new Date();
  }

  function render() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let filtered = events.filter(e => {
      if (activeCat && e.category !== activeCat) return false;
      if (q && !e.title?.toLowerCase().includes(q) && !e.description?.toLowerCase().includes(q)) return false;
      return true;
    });

    const grid  = document.getElementById('events-grid');
    const empty = document.getElementById('empty-screen');

    if (!filtered.length) {
      grid.style.display = 'none'; empty.style.display = 'block'; return;
    }
    empty.style.display = 'none';
    grid.style.display  = 'grid';
    grid.innerHTML = filtered.map((e, i) => {
      const past = isPast(e.event_end || e.event_date);
      return `
      <div class="event-card" style="animation-delay:${i*.06}s;${past ? 'opacity:.6' : ''}">
        <div class="card-img">
          ${e.thumbnail_url
            ? `<img src="${e.thumbnail_url}" alt="${e.title}" />`
            : `<span style="opacity:.35">🗓️</span>`}
          ${e.category ? `<span class="card-cat-overlay">${e.category}</span>` : ''}
          ${past ? `<div style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:white;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;">הסתיים</div>` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${e.title}</div>
          ${e.description ? `<div class="card-summary">${e.description.slice(0,110)}${e.description.length>110?'…':''}</div>` : ''}
          <div class="card-meta">
            ${e.event_date ? `<div class="card-meta-row"><i class="fas fa-calendar"></i> ${formatDate(e.event_date)}</div>` : ''}
            ${e.event_date ? `<div class="card-meta-row"><i class="fas fa-clock"></i> ${formatTime(e.event_date)}${e.event_end ? ' — ' + formatTime(e.event_end) : ''}</div>` : ''}
            ${e.location   ? `<div class="card-meta-row"><i class="fas fa-map-marker-alt"></i> ${e.location}</div>` : ''}
            ${e.max_spots  ? `<div class="card-meta-row"><i class="fas fa-users"></i> עד ${e.max_spots} משתתפים</div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  init();
</script>
</body>
</html>

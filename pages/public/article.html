<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מאמר | FitBalance</title>
  <meta name="description" content="" id="meta-desc" />
  <link rel="icon" type="image/png" href="../../assets/icons/icon.png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', sans-serif; background: #faf9ff; }

    header { position: fixed; top: 0; right: 0; left: 0; background: white; z-index: 40; height: 64px;
      display: flex; align-items: center; padding: 0 24px; justify-content: space-between;
      border-bottom: 1px solid #f3f0ff; box-shadow: 0 2px 12px rgba(139,92,246,.06); }

    .gradient-text { background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .article-wrap { max-width: 780px; margin: 0 auto; padding: 88px 24px 80px; }

    .breadcrumb { display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #9ca3af; margin-bottom: 32px; flex-wrap: wrap; }
    .breadcrumb a { color: #7c3aed; text-decoration: none; font-weight: 600; }
    .breadcrumb a:hover { color: #ec4899; }

    .hero-img { width: 100%; height: 360px; object-fit: cover;
      border-radius: 20px; margin-bottom: 36px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12); display: block; }
    .hero-placeholder { width: 100%; height: 220px; border-radius: 20px;
      background: linear-gradient(135deg, #f5f3ff, #fce7f3);
      display: flex; align-items: center; justify-content: center;
      font-size: 60px; margin-bottom: 36px; opacity: .6; }

    .article-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
    .cat-badge { font-size: 11px; font-weight: 700; letter-spacing: .05em;
      background: linear-gradient(135deg, #fce7f3, #ede9fe);
      color: #7c3aed; border-radius: 999px; padding: 4px 12px;
      border: 1px solid rgba(139,92,246,.15); }
    .meta-item { font-size: 13px; color: #9ca3af; display: flex; align-items: center; gap: 5px; }
    .meta-item i { color: #c4b5fd; }

    .article-title { font-size: clamp(24px, 4vw, 38px); font-weight: 900; line-height: 1.25;
      color: #111827; margin-bottom: 18px; letter-spacing: -.02em; }
    .divider { width: 44px; height: 3px; border-radius: 2px;
      background: linear-gradient(90deg, #ec4899, #8b5cf6); margin: 24px 0; }
    .article-summary { font-size: 17px; color: #374151; line-height: 1.8; font-weight: 500;
      border-right: 3px solid #ec4899; padding-right: 16px; margin-bottom: 28px; }

    .article-content { font-size: 16px; line-height: 2; color: #374151; }
    .article-content h1 { font-size:26px; font-weight:900; color:#111827; margin:24px 0 10px; }
    .article-content h2 { font-size:21px; font-weight:800; color:#1f2937; margin:20px 0 8px; }
    .article-content h3 { font-size:17px; font-weight:700; color:#374151; margin:18px 0 6px; }
    .article-content p  { margin-bottom:14px; }
    .article-content ul, .article-content ol { padding-right:22px; margin-bottom:14px; }
    .article-content li { margin-bottom:5px; }
    .article-content strong { font-weight:700; }
    .article-content em { font-style:italic; }
    .article-content u  { text-decoration:underline; }
    .article-content a  { color:#7c3aed; text-decoration:underline; }
    .article-content a:hover { color:#ec4899; }
    .article-content img { max-width:100%; border-radius:12px; margin:14px 0; }
    .article-content .ql-size-small  { font-size:12px; }
    .article-content .ql-size-large  { font-size:20px; }
    .article-content .ql-size-huge   { font-size:26px; }

    .back-btn { display: inline-flex; align-items: center; gap: 8px;
      margin-top: 48px; padding: 11px 22px;
      border: 1.5px solid #e5e7eb; border-radius: 12px;
      font-size: 14px; font-weight: 600; color: #6b7280;
      text-decoration: none; transition: all .2s; background: white; }
    .back-btn:hover { border-color: #8b5cf6; color: #7c3aed; }

    .state-msg { text-align: center; padding: 100px 24px; color: #9ca3af; }
    .spinner { width: 32px; height: 32px; border: 3px solid #ede9fe;
      border-top-color: #8b5cf6; border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="../../assets/icons/logo.jpg" alt="FitBalance" style="height:44px;" onerror="this.style.display='none'" />
    <span class="gradient-text" style="font-size:18px;font-weight:800;">FitBalance</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="articles.html" style="font-size:13px;font-weight:600;color:#6b7280;text-decoration:none;display:flex;align-items:center;gap:6px;">
      <i class="fas fa-arrow-right" style="font-size:11px;"></i> כל המאמרים
    </a>
    <a href="../../login.html" style="background:linear-gradient(135deg,#ec4899,#8b5cf6);color:white;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;">
      כניסה לאזור אישי
    </a>
  </div>
</header>

<!-- Loading -->
<div id="loading-screen" class="state-msg">
  <div class="spinner"></div>
  <p style="font-size:14px">טוען מאמר...</p>
</div>

<!-- Error -->
<div id="error-screen" class="state-msg" style="display:none;">
  <div style="font-size:40px;margin-bottom:14px;opacity:.4">😕</div>
  <p style="font-size:16px;font-weight:600;color:#374151;margin-bottom:8px">המאמר לא נמצא</p>
  <a href="articles.html" style="color:#7c3aed;font-size:14px;font-weight:600;text-decoration:none;">← חזרה לכל המאמרים</a>
</div>

<!-- Article -->
<div id="article-screen" style="display:none;animation:fadeUp .5s ease both;">
  <div class="article-wrap">

    <div class="breadcrumb">
      <a href="../../home.html">דף הבית</a>
      <span>/</span>
      <a href="articles.html">מאמרים</a>
      <span>/</span>
      <span id="bc-title" style="color:#374151;"></span>
    </div>

    <div id="hero-wrap"></div>
    <div class="article-meta" id="article-meta"></div>
    <h1 class="article-title" id="article-title"></h1>
    <div class="divider"></div>
    <div class="article-summary" id="article-summary" style="display:none;"></div>
    <div class="article-content" id="article-content"></div>

    <a href="articles.html" class="back-btn">
      <i class="fas fa-arrow-right"></i>
      חזרה לכל המאמרים
    </a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../services/supabaseClient.js"></script>
<script>
  const sb = window._sb;
  const id = new URLSearchParams(location.search).get('id');
  const TYPE_LABEL = { video: '🎬 סרטון', post: '📄 כתבה', tip: '💡 טיפ' };

  async function init() {
    if (!id) { showError(); return; }

    const { data, error } = await sb
      .from('articles')
      .select('*')
      .eq('id', id)
      .eq('is_published', true)
      .maybeSingle();

    document.getElementById('loading-screen').style.display = 'none';
    if (error || !data) { showError(); return; }
    renderArticle(data);
  }

  function renderArticle(a) {
    document.title = a.title + ' | FitBalance';
    document.getElementById('meta-desc').setAttribute('content', a.description || '');
    document.getElementById('bc-title').textContent = a.title;

    const heroWrap = document.getElementById('hero-wrap');
    const heroImg = a.cover_image_url || a.thumbnail_url;
    if (a.type === 'video' && a.video_url) {
      const embed = getEmbedUrl(a.video_url);
      if (embed) {
        heroWrap.innerHTML = `<div style="border-radius:20px;overflow:hidden;aspect-ratio:16/9;margin-bottom:36px;box-shadow:0 12px 40px rgba(0,0,0,.12)"><iframe src="${embed}" style="width:100%;height:100%;border:none" allowfullscreen></iframe></div>`;
      } else {
        const ext = a.video_url.split('.').pop().toLowerCase().split('?')[0];
        const mimeMap = { mp4:'video/mp4', mov:'video/mp4', webm:'video/webm', ogg:'video/ogg' };
        heroWrap.innerHTML = `<video controls style="width:100%;border-radius:20px;margin-bottom:36px;max-height:460px;background:#000"><source src="${a.video_url}" type="${mimeMap[ext]||'video/mp4'}" /></video>`;
      }
      if (heroImg) heroWrap.innerHTML += `<img class="hero-img" src="${heroImg}" alt="${a.title}" style="margin-top:0" />`;
    } else if (heroImg) {
      heroWrap.innerHTML = `<img class="hero-img" src="${heroImg}" alt="${a.title}" />`;
    } else {
      heroWrap.innerHTML = `<div class="hero-placeholder">${TYPE_LABEL[a.type]?.split(' ')[0] || '📝'}</div>`;
    }

    const parts = [];
    if (a.type)        parts.push(`<span class="cat-badge">${TYPE_LABEL[a.type] || a.type}</span>`);
    if (a.category)    parts.push(`<span class="cat-badge" style="background:#f0fdf4;color:#166534;border-color:rgba(22,101,52,.15)">${a.category}</span>`);
    if (a.author)      parts.push(`<span class="meta-item"><i class="fas fa-user-circle"></i>${a.author}</span>`);
    if (a.published_at) parts.push(`<span class="meta-item"><i class="fas fa-calendar-alt"></i>${new Date(a.published_at).toLocaleDateString('he-IL')}</span>`);
    document.getElementById('article-meta').innerHTML = parts.join('');
    document.getElementById('article-title').textContent = a.title;

    if (a.description) {
      document.getElementById('article-summary').textContent = a.description;
      document.getElementById('article-summary').style.display = 'block';
    }
    if (a.content) document.getElementById('article-content').innerHTML = a.content;

    document.getElementById('article-screen').style.display = 'block';
    recordView(a.id);
  }

  async function recordView(articleId) {
    const key = `viewed_article_${articleId}`;
    const last = localStorage.getItem(key);
    if (last && Date.now() - Number(last) < 86400000) return; // 24 שעות

    try {
      const { ip } = await fetch('https://api.ipify.org?format=json').then(r => r.json());
      await sb.from('article_views').insert({ article_id: articleId, ip_address: ip });
      localStorage.setItem(key, Date.now());
    } catch(e) {
      // שגיאה ברישום צפייה — לא קריטי
    }
  }

  function getEmbedUrl(url) {
    const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
    if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
    const vm = url.match(/vimeo\.com\/(\d+)/);
    if (vm) return `https://player.vimeo.com/video/${vm[1]}`;
    if (url.includes('embed')) return url;
    return null;
  }

  function showError() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'block';
  }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitBalance | מאמרים</title>
  <link rel="icon" type="image/png" href="../../assets/icons/icon.png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', sans-serif; background: #faf9ff; }

    header { position: fixed; top: 0; right: 0; left: 0; background: white; z-index: 40; height: 64px;
      display: flex; align-items: center; padding: 0 24px; justify-content: space-between;
      border-bottom: 1px solid #f3f0ff; box-shadow: 0 2px 12px rgba(139,92,246,.06); }

    .gradient-text { background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .cat-btn { border: 1.5px solid #e5e7eb; border-radius: 999px; background: white; color: #6b7280;
      font-size: 13px; font-weight: 600; padding: 7px 18px; font-family: inherit;
      cursor: pointer; transition: all .2s; white-space: nowrap; }
    .cat-btn:hover { border-color: #8b5cf6; color: #7c3aed; }
    .cat-btn.active { background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white; border-color: transparent; box-shadow: 0 4px 14px rgba(236,72,153,.25); }

    .sort-btn { border: 1.5px solid #e5e7eb; border-radius: 999px; background: white; color: #6b7280;
      font-size: 13px; font-weight: 600; padding: 7px 18px; font-family: inherit;
      cursor: pointer; transition: all .2s; white-space: nowrap; }
    .sort-btn:hover { border-color: #8b5cf6; color: #7c3aed; }
    .sort-btn.active { background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white; border-color: transparent; box-shadow: 0 4px 14px rgba(236,72,153,.25); }

    .article-card { background: white; border-radius: 18px; border: 1px solid #f0eeff;
      box-shadow: 0 2px 16px rgba(139,92,246,.06); overflow: hidden;
      text-decoration: none; color: inherit; display: flex; flex-direction: column;
      transition: transform .25s, box-shadow .25s; }
    .article-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(139,92,246,.13); }

    .card-img { height: 200px; background: linear-gradient(135deg, #f5f3ff, #fce7f3);
      display: flex; align-items: center; justify-content: center;
      font-size: 52px; overflow: hidden; flex-shrink: 0; position: relative; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-cat-overlay { position: absolute; bottom: 10px; right: 10px;
      background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
      color: #7c3aed; font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(139,92,246,.2); }

    .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .card-title { font-size: 16px; font-weight: 800; color: #111827; line-height: 1.4; }
    .card-summary { font-size: 13px; color: #6b7280; line-height: 1.7; flex: 1; }
    .card-footer { display: flex; justify-content: space-between; align-items: center;
      padding-top: 12px; border-top: 1px solid #f3f0ff; font-size: 12px; color: #9ca3af; }

    .search-wrap { position: relative; }
    .search-wrap i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: #9ca3af; font-size: 14px; pointer-events: none; }
    .search-wrap input { padding: 10px 40px 10px 16px; border: 1.5px solid #e5e7eb;
      border-radius: 12px; font-size: 14px; font-family: inherit; outline: none;
      background: white; transition: border-color .2s; width: 220px; }
    .search-wrap input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,.08); }

    .spinner { width: 36px; height: 36px; border: 3px solid #ede9fe;
      border-top-color: #8b5cf6; border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp .4s ease both; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="../../assets/icons/logo.jpg" alt="FitBalance" style="height:44px;" onerror="this.style.display='none'" />
    <span class="gradient-text" style="font-size:18px;font-weight:800;">FitBalance</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="../../home.html" style="font-size:13px;font-weight:600;color:#6b7280;text-decoration:none;display:flex;align-items:center;gap:6px;">
      <i class="fas fa-arrow-right" style="font-size:11px;"></i> דף הבית
    </a>
    <a href="../../login.html" style="background:linear-gradient(135deg,#ec4899,#8b5cf6);color:white;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;">
      כניסה לאזור אישי
    </a>
  </div>
</header>

<!-- Main -->
<main style="padding: 88px 24px 60px; max-width: 1100px; margin: 0 auto;">

  <!-- Hero -->
  <div style="text-align:center;margin-bottom:40px;" class="fade-up">
    <h1 style="font-size:clamp(28px,5vw,44px);font-weight:900;color:#111827;margin-bottom:10px;">
      📝 <span class="gradient-text">מאמרים ותוכן</span>
    </h1>
    <p style="font-size:16px;color:#6b7280;">טיפים, מדריכים וסרטונים מצוות FitBalance</p>
  </div>

  <!-- Filters -->
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;" class="fade-up">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="חיפוש מאמרים..." oninput="render()" />
    </div>
    <div id="cat-bar" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="cat-btn active" onclick="setCat('',this)">הכל</button>
    </div>
  </div>

  <!-- Sort -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;" class="fade-up">
    <button class="sort-btn active" onclick="setSort('recommended',this)">⭐ מומלצים</button>
    <button class="sort-btn" onclick="setSort('newest',this)">🆕 הכי חדש</button>
    <button class="sort-btn" onclick="setSort('popular',this)">🔥 הכי פופולרי</button>
  </div>

  <!-- Loading -->
  <div id="loading" style="text-align:center;padding:60px 0;color:#9ca3af;">
    <div class="spinner"></div>
    <p>טוען מאמרים...</p>
  </div>

  <!-- Empty -->
  <div id="empty" style="display:none;text-align:center;padding:60px 0;color:#9ca3af;">
    <div style="font-size:48px;margin-bottom:12px;opacity:.4">📭</div>
    <p style="font-size:15px;">לא נמצאו מאמרים</p>
  </div>

  <!-- Grid -->
  <div id="grid" style="display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../services/supabaseClient.js"></script>
<script>
  const sb = window._sb;
  let articles = [], activeCat = '', activeSort = 'recommended', viewsMap = {};
  const TYPE_ICON = { video: '🎬', post: '📄', tip: '💡' };

  async function init() {
    const [{ data, error }, { data: views }] = await Promise.all([
      sb.from('articles')
        .select('id,title,description,thumbnail_url,author,category,type,published_at,sort_order')
        .eq('is_published', true)
        .order('sort_order', { ascending: true })
        .order('published_at', { ascending: false }),
      sb.from('article_views_count').select('article_id,views_count').then(r => r.error ? { data: [] } : r),
    ]);

    document.getElementById('loading').style.display = 'none';

    if (error || !data?.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    articles = data;
    viewsMap = {};
    (views ?? []).forEach(v => { viewsMap[v.article_id] = Number(v.views_count) || 0; });
    buildCats();
    render();
  }

  function buildCats() {
    const cats = [...new Set(articles.map(a => a.category).filter(Boolean))].sort();
    const bar = document.getElementById('cat-bar');
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.textContent = cat;
      btn.onclick = () => setCat(cat, btn);
      bar.appendChild(btn);
    });
  }

  function setCat(cat, btn) {
    activeCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function setSort(sort, btn) {
    activeSort = sort;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    let list = articles.filter(a => {
      if (activeCat && a.category !== activeCat) return false;
      if (q && !a.title?.toLowerCase().includes(q) && !a.description?.toLowerCase().includes(q)) return false;
      return true;
    });

    if (activeSort === 'newest') {
      list = [...list].sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
    } else if (activeSort === 'popular') {
      list = [...list].sort((a, b) => (viewsMap[b.id] || 0) - (viewsMap[a.id] || 0));
    }

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    if (!list.length) {
      grid.style.display = 'none'; empty.style.display = 'block'; return;
    }
    empty.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = list.map((a, i) => `
      <a class="article-card fade-up" href="../customer/article.html?id=${a.id}" style="animation-delay:${i * .05}s">
        <div class="card-img">
          ${a.thumbnail_url
            ? `<img src="${a.thumbnail_url}" alt="${a.title}" />`
            : `<span style="opacity:.35">${TYPE_ICON[a.type] || '📝'}</span>`}
          ${a.category ? `<span class="card-cat-overlay">${a.category}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${a.title}</div>
          ${a.description ? `<div class="card-summary">${a.description.slice(0,110)}${a.description.length > 110 ? '…' : ''}</div>` : ''}
          <div class="card-footer">
            <span style="display:flex;align-items:center;gap:5px;">
              <i class="fas fa-user-circle" style="color:#c4b5fd"></i> ${a.author || 'FitBalance'}
            </span>
            <span>${a.published_at ? new Date(a.published_at).toLocaleDateString('he-IL') : ''}</span>
          </div>
        </div>
      </a>`).join('');
  }

  init();
</script>
</body>
</html>

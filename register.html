<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="icon" type="image/png" href="assets/icons/icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitBalance | הרשמה לאזור האישי</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #ec4899, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .page-bg { min-height: 100vh; background: linear-gradient(135deg, #fce7f3 0%, #ede9fe 100%); position: relative; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.4; animation: pulse-blob 7s ease-in-out infinite; pointer-events: none; }
    .blob-1 { width:400px;height:400px;background:radial-gradient(circle,rgba(236,72,153,.3),transparent 70%);top:-150px;left:-150px; }
    .blob-2 { width:300px;height:300px;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 70%);bottom:-100px;right:-100px;animation-delay:3s; }
    @keyframes pulse-blob { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
    .card { background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.6); border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.12); padding: 1.4rem 1.75rem; }
    .input-field { width: 100%; padding: .55rem 2.5rem .55rem 2rem; border: 2px solid #e5e7eb; border-radius: .65rem; font-size: .875rem; outline: none; direction: rtl; transition: border-color .2s, box-shadow .2s; background: white; }
    .input-field:focus { border-color:#ec4899; box-shadow:0 0 0 3px rgba(236,72,153,.1); }
    .input-icon { position:absolute;right:.75rem;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none;font-size:.8rem; }
    .btn-primary { width:100%; padding:.65rem; border:none; cursor:pointer; background:linear-gradient(135deg,#ec4899,#8b5cf6); color:white; font-size:.9rem; font-weight:600; border-radius:.65rem; box-shadow:0 6px 18px rgba(236,72,153,.35); transition:opacity .2s, transform .2s; }
    .btn-primary:hover:not(:disabled) { opacity:.92; transform:translateY(-1px); }
    .btn-primary:disabled { opacity:.7; cursor:not-allowed; }
    .error-box { background:#fef2f2; border:1px solid #fecaca; color:#dc2626; border-radius:.65rem; padding:.45rem .75rem; font-size:.8rem; display:flex; align-items:center; gap:.4rem; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
    .shake { animation:shake .4s ease; }
    .spinner { width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .slide-up { animation:slideUp .5s ease both; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="page-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="relative z-10 w-full max-w-sm slide-up">

    <div class="text-center mb-3">
      <a href="home.html" class="inline-flex items-center gap-2">
        <img src="assets/icons/logo.jpg" alt="FitBalance" class="h-9 rounded-lg shadow" onerror="this.style.display='none'" />
        <span class="text-2xl font-bold gradient-text">FitBalance</span>
      </a>
    </div>

    <div class="card">

      <div class="text-center mb-3">
        <h1 class="text-base font-bold text-gray-800">הרשמה לאזור האישי 🎉</h1>
        <p class="text-gray-400 text-xs mt-0.5">מלאי את הפרטים כדי ליצור חשבון</p>
      </div>

      <div id="error-msg" class="error-box hidden mb-3">
        <i class="fas fa-exclamation-circle text-red-400"></i>
        <span></span>
      </div>

      <form id="register-form" novalidate class="space-y-2.5">

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block text-xs font-medium text-gray-600 mb-1">שם פרטי</label>
            <div class="relative">
              <span class="input-icon"><i class="fas fa-user"></i></span>
              <input id="firstName" type="text" class="input-field" placeholder="שרה" required />
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-xs font-medium text-gray-600 mb-1">שם משפחה</label>
            <div class="relative">
              <span class="input-icon"><i class="fas fa-user"></i></span>
              <input id="lastName" type="text" class="input-field" placeholder="כהן" required />
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">תעודת זהות</label>
          <div class="relative">
            <span class="input-icon"><i class="fas fa-id-card"></i></span>
            <input id="idNumber" type="text" class="input-field" placeholder="מספר ת.ז" maxlength="9" required />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">כתובת אימייל</label>
          <div class="relative">
            <span class="input-icon"><i class="fas fa-envelope"></i></span>
            <input id="email" type="email" class="input-field" placeholder="your@email.com" required />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">מספר נייד</label>
          <div class="relative">
            <span class="input-icon"><i class="fas fa-mobile-alt"></i></span>
            <input id="phone" type="tel" class="input-field" placeholder="05X-XXXXXXX" autocomplete="tel" required />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">סיסמה</label>
          <div class="relative">
            <span class="input-icon"><i class="fas fa-lock"></i></span>
            <input id="password" type="password" class="input-field" placeholder="לפחות 6 תווים" autocomplete="new-password" required />
            <button type="button" class="toggle-password absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs" data-target="password" tabindex="-1">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">אישור סיסמה</label>
          <div class="relative">
            <span class="input-icon"><i class="fas fa-lock"></i></span>
            <input id="confirm" type="password" class="input-field" placeholder="הכניסי שוב את הסיסמה" autocomplete="new-password" required />
            <button type="button" class="toggle-password absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs" data-target="confirm" tabindex="-1">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary flex items-center justify-center gap-2">
          <span id="btn-spinner" class="spinner hidden"></span>
          <span id="btn-text">הרשמה</span>
          <i class="fas fa-arrow-left text-xs"></i>
        </button>

      </form>

      <div id="success-msg" class="hidden text-center py-4">
        <div class="text-4xl mb-3">📧</div>
        <p class="text-gray-800 font-semibold text-sm">נשלח מייל אימות לכתובתך!</p>
        <p class="text-gray-400 text-xs mt-1">לחצי על הקישור במייל כדי להפעיל את החשבון</p>
        <a href="login.html" class="inline-block mt-4 text-pink-600 text-xs font-semibold hover:underline">חזרה להתחברות ←</a>
      </div>

      <div class="flex justify-between items-center mt-3 text-xs">
        <a href="login.html" class="text-pink-600 font-semibold hover:underline">כבר יש לי חשבון</a>
        <a href="home.html" class="text-gray-400 hover:text-pink-600 transition-colors">
          <i class="fas fa-arrow-right ml-1"></i> דף הבית
        </a>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="utils/constants.js"></script>
<script src="utils/storage.js"></script>
<script src="services/supabaseClient.js"></script>
<script src="services/authService.js"></script>
<script src="assets/js/pages/register.js"></script>
</body>
</html>
